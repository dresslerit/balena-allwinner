# RTL8723CS WiFi Driver Configuration
# Optimized for weak signal handling and connection stability

# Disable power management for maximum performance and reliability
options 8723cs rtw_power_mgnt=0
options 8723cs rtw_ips_mode=0

# Disable Bluetooth coexistence to reduce interference
options 8723cs rtw_btcoex_enable=0

# Enable verbose logging for diagnostics (level 4 = INFO)
# Levels: 1=ALWAYS, 2=ERROR, 3=WARNING, 4=INFO, 5=DEBUG, 6=TRACE
options 8723cs rtw_drv_log_level=4

# Monitor hardware status
options 8723cs rtw_check_hw_status=1
