# Disable buggy power management and BT coexistence in the 8723cs driver
# Enable hardware status checking for diagnostics
# Signal boost parameters - disable TX power limiting and adaptivity throttling
options 8723cs rtw_power_mgnt=0 rtw_ips_mode=0 rtw_btcoex_enable=0 rtw_check_hw_status=1 rtw_tx_pwr_lmt_enable=0 rtw_adaptivity_en=0 rtw_ampdu_enable=1
