#@TYPE: Machine
#@NAME: ty33a-8g1g
#@DESCRIPTION: Machine configuration for the TY33A 8G 1G A33 board (Allwinner A33)

require conf/machine/include/sun8i.inc

# Use our custom kernel configuration with proper MMC support
PREFERRED_VERSION_linux-mainline = "5.15.35"

# Override kernel image type to use legacy uImage format for U-Boot compatibility
KERNEL_IMAGETYPE = "uImage"

KERNEL_DEVICETREE = "sun8i-a33-ty33a-8g1g.dtb"
# KERNEL_DEVICETREE = "sun8i-r16-bananapi-m2m.dtb"
UBOOT_MACHINE = "ty33a_8g1g_defconfig"

# Enable UART debug for U-Boot (if not already in defconfig)
#UBOOT_CONFIG += " uart_debug"

# Serial console: keep kernel/userspace console on UART only
SERIAL_CONSOLES = "115200;ttyS0"
SERIAL_CONSOLES_CHECK = "115200;ttyS0"


# Include Realtek RTL8723 firmware
MACHINE_EXTRA_RRECOMMENDS += " linux-firmware-rtl8723"

KERNEL_MODULE_AUTOLOAD += "8723cs"

# Bootloader configuration for flashing to internal storage
# The bootloader needs to be written at block 8 (8 * 1024 = 8192 bytes offset)
# This matches the dd command in balena-image.inc
# Note: Actual device is mmcblk2 (set in resin-init-flasher.bbappend)
# as the kernel enumerates the eMMC differently at runtime
BOOTLOADER_FLASH_DEVICE = "mmcblk2"
BOOTLOADER_IMAGE = "u-boot-sunxi-with-spl.bin"
BOOTLOADER_BLOCK_SIZE_OFFSET = "1024"
BOOTLOADER_SKIP_OUTPUT_BLOCKS = "8"

# Internal device configuration for flasher
# Note: Set in resin-init-flasher.bbappend to mmcblk2
INTERNAL_DEVICE_KERNEL = "mmcblk2"

# Disable kernel headers test - requires x86_64 Docker on ARM64 build host
BALENA_DISABLE_KERNEL_HEADERS = "1"
